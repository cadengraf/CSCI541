# One command: ../.venv/bin/python benchmark.py vehicle
# These are evaluation inputs, not inputs to tracking or memory updates.
protocol: kitti_mots_standard_val_v1
sequences: [2, 6, 7, 8, 10, 13, 14, 16, 18]
data_root: data/kitti_mots
cache: data/tracking/teacher_cache
features: data/vehicle_benchmark/specialist
predictions: data/vehicle_benchmark/source_mask_predictions
output: metrics/vehicle_benchmark
pipeline_config: configs/vehicle_reid.yaml
cpu_threads: 4
cpu_workers: 3
checkpoint_every: 25
# Raw cache retains low-score candidates; appearance methods use >=0.3.
score_threshold: 0.3
min_mask_pixels: 10
recovery_window: 10
cross_camera: true
methods: [bytetrack, ocsort, legacy_joint, memory_joint, legacy_specialist, memory_specialist, memory_specialist_unguarded]
source:
  bytetrack:
    repository: https://github.com/FoundationVision/ByteTrack.git
    directory: utils/vendor/ByteTrack
    revision: d1bf0191adff59bc8fcfeaa0b33d3d1642552a99
  ocsort:
    repository: https://github.com/noahcao/OC_SORT.git
    directory: utils/vendor/OC_SORT
    revision: 8462e7e729a93ccd3bd995c0a79a890336cb3a0b
bytetrack:
  track_thresh: 0.3
  track_buffer: 45  # upstream scales to 15 frames at KITTI's 10 FPS
  match_thresh: 0.8
  mot20: false
ocsort:
  det_thresh: 0.3
  max_age: 15
  min_hits: 3
  iou_threshold: 0.3
  delta_t: 3
  inertia: 0.2
  use_byte: true
