# Paths resolve from this file's project_root, not your shell's working directory.
project_root: ..
evaluate_after_train: true
full_frame:
  protocol: kitti_mots_standard_val_v1
  architecture: resnet50_fpn_v2
  data_root: data/kitti_mots
  train_sequences: [0, 1, 3, 4, 5, 9, 11, 12, 15, 17, 19, 20]
  val_sequences: [2, 6, 7, 8, 10, 13, 14, 16, 18]
  pretrained: true  # COCO weights only; never initialize from the old KITTI checkpoints
  image_size: 640
  batch_pairs: 1
  epochs: 8
  max_pairs: null
  learning_rate: 0.0001
  workers: 0
  seed: 42
  save_every_steps: 250
  checkpoint: checkpoints/kitti_mots/joint.pt
tracking:
  name: joint
  score_threshold: 0.5
  mask_threshold: 0.5
  min_mask_pixels: 10
  max_age: 15
  appearance_weight: 0.5
  min_iou: 0.05
  min_cosine: 0.7
  max_center_distance: 2.0
  max_match_cost: 0.8
  feature_momentum: 0.9
  predictions_root: data/kitti_mots/benchmark
  metrics_root: metrics/kitti_mots
  # Add external methods only after generating their predictions on this split.
  # Each folder needs data/0002.txt, data/0006.txt, ... in KITTI MOTS format.
  external_trackers: {}
