# Accuracy-first research teacher. This is a new architecture, not the old student.
project_root: ..
environment: ../.teacher-env
source:
  repository: https://github.com/Sense-X/Co-DETR.git
  revision: 26653521e47157fdd819e764b4bb949057ea9f3b
  directory: utils/vendor/Co-DETR
  config: projects/configs/co_dino_vit/co_dino_5scale_vit_large_coco_instance.py
pretrained:
  url: https://huggingface.co/zongzhuofan/co-detr-vit-large-coco-instance/resolve/43f7a37ff2bdb9373ced4077e1ca740431179104/pytorch_model.pth
  path: checkpoints/pretrained/co_dino_vit_large_coco_instance.pth
  sha256: d21b1ddd0ac501b72d7d9d48390bcadbdf76e3195a976f7c6d0c93a6fb5046bf
  bytes: 3084101615
data:
  kitti_root: data/kitti_mots
  train_sequences: [0, 1, 3, 4, 5, 9, 11, 12, 15, 17, 19, 20]
  val_sequences: [2, 6, 7, 8, 10, 13, 14, 16, 18]
  vrai_train: data/aerial/vrai/train_disjoint.csv
  vrai_calibration_query: data/aerial/vrai/calibration_query.csv
  vrai_calibration_gallery: data/aerial/vrai/calibration_gallery.csv
  vrai_query: data/aerial/vrai/query.csv
  vrai_gallery: data/aerial/vrai/gallery.csv
model:
  short_side: 384
  max_side: 1280
  crop_size: 384
  embedding_dim: 256
  classifier_scale: 30.0
  classifier_margin: 0.15
  unfreeze_last_blocks: 4
training:
  epochs: 12
  frozen_backbone_epochs: 2
  batch_pairs: 1
  identities_per_batch: 4
  kitti_steps_per_vrai_step: 2
  learning_rate: 0.00002
  backbone_learning_rate: 0.000002
  weight_decay: 0.0001
  triplet_margin: 0.3
  reid_weight: 1.0
  mixed_precision: true
  save_every_steps: 250
  calibration_max_ids: 128  # fixed calibration subset for checkpoint selection; final 630 IDs stay untouched
  seed: 42
  checkpoint: checkpoints/teacher/co_dino_joint.last.pt
  best_checkpoint: checkpoints/teacher/co_dino_joint.best.pt
  log: metrics/teacher/training.csv
  evaluate_after_train: true
tracking:
  name: codino_teacher
  score_threshold: 0.3
  mask_threshold: 0.5
  min_mask_pixels: 10
  max_age: 15
  appearance_weight: 0.5
  min_iou: 0.05
  min_cosine: 0.7
  max_center_distance: 2.0
  max_match_cost: 0.8
  feature_momentum: 0.9
  predictions_root: data/kitti_mots/teacher_benchmark
  metrics_root: metrics/teacher/kitti_mots
