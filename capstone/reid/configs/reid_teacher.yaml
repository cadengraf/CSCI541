# Dedicated vehicle identity teacher. Detection and masks are not trained here.
source:
  repository: https://github.com/damo-cv/TransReID.git
  directory: utils/vendor/TransReID
  revision: dec55046fcdfadee14e2c28e2df89305d8f7557a
pretrained:
  path: checkpoints/pretrained/transreid_veri_vit.pth
  google_drive_id: 1SquTlBhl_pahsa5752KoGDBPY-AZpoSg
  sha256: 8002d0d72b0e937f163089233fb7147f64c0938b8dbbdb36e07d3083eb25b73c
data:
  train: data/aerial/vrai/train_disjoint.csv
  calibration_query: data/aerial/vrai/calibration_query.csv
  calibration_gallery: data/aerial/vrai/calibration_gallery.csv
  query: data/aerial/vrai/query.csv
  gallery: data/aerial/vrai/gallery.csv
references:
  compact: checkpoints/vehicle_warmstart/reid_only.pt
  msinet_source: data/aerial/vru/baselines/Benchmarking-ReID
  msinet_weights: data/aerial/vru/baselines/msinet_vru_clean.pth
  msinet_revision: 8b1cb5551fadfb4b5dde62769a250ba2416e13fe
  msinet_sha256: 3b31ed0410c7901aa26aa603c75f3e6e7519d6c9702a6bba7a0585f9b0f66962
model:
  image_size: 256
  stride: 12
  activation_checkpointing: true
training:
  epochs: 30
  steps_per_epoch: 1600
  identities_per_batch: 8
  images_per_identity: 4  # two crops per camera, two distinct cameras per identity
  classifier_warmup_epochs: 1
  learning_rate: 0.00001
  classifier_learning_rate: 0.0001
  weight_decay: 0.0001
  triplet_margin: 0.3
  label_smoothing: 0.1
  mixed_precision: true
  save_every_steps: 200
  seed: 42
  checkpoint: checkpoints/reid_teacher/transreid.last.pt
  best_checkpoint: checkpoints/reid_teacher/transreid.best.pt
  log: metrics/reid_teacher/training.csv
evaluation:
  batch_size: 32
  workers: 0
  output: metrics/reid_teacher
