# Run `python train.py` from this directory. Paths are relative to this file.
# Read ARCHITECTURE.md for the model and command call paths.
# Training reads the top-level settings and `sources` below. Other named
# sections configure prepare.py, demo.py, and benchmark.py.
reid_only: false            # joint identity and VOC mask training
sop_root: data/sop
abo_root: data/abo
voc_root: data/voc
fashion_root: null
abo_max_items: null

# AICity becomes active automatically after `python prepare.py aicity` prepares its crops.
sources:
  - name: visdrone
    train: data/aerial/visdrone/train.csv
    query: data/aerial/visdrone/query.csv
    gallery: data/aerial/visdrone/gallery.csv
    calibration_query: null
    calibration_gallery: null
    cross_view: false
    optional: false
  - name: aicity
    train: data/aicity/train.csv
    query: data/aicity/query.csv
    gallery: data/aicity/gallery.csv
    calibration_query: data/aicity/calibration_query.csv
    calibration_gallery: data/aicity/calibration_gallery.csv
    cross_view: true
    optional: true
  - name: vrai
    train: data/aerial/vrai/train_disjoint.csv
    query: data/aerial/vrai/query.csv
    gallery: data/aerial/vrai/gallery.csv
    calibration_query: data/aerial/vrai/calibration_query.csv
    calibration_gallery: data/aerial/vrai/calibration_gallery.csv
    cross_view: true
    optional: true
  - name: vru
    train: data/aerial/vru/train.csv
    query: null            # Keep the official test IDs out of training.
    gallery: null
    calibration_query: null
    calibration_gallery: null
    cross_view: false
    optional: true

resume: checkpoints/joint_balanced.pt
checkpoint: checkpoints/joint_aerial_validated.pt
epochs: 12
batch_size: 64
instances_per_id: 4       # 16 identities x 4 crops per batch
steps_per_epoch: 1000      # 12,000 updates across the full run
source_batch_weights:     # balanced sampling across six active identity sources
  sop: 2
  abo: 2
  visdrone: 2
  aicity: 2
  vrai: 2
  vru: 2
triplet_margin: 0.2
triplet_weight: 1.0
mask_every: 2            # one VOC batch every two ReID batches
mask_loss_weight: 1.0
learning_rate: 0.00002
workers: 0
seed: 42
augmentation: strong
download_voc: false
evaluate_after_train: true

# Select the best epoch against the starting checkpoint. SOP, ABO, VisDrone,
# and VOC validation data are split by identity/image into selection and holdout
# halves. AICity uses its separate calibration IDs; its test IDs stay untouched.
# Preservation floors prevent a large regression in masks or general ReID.
selection:
  weights:
    vrai_map: 0.50
    aicity_map: 0.20
    visdrone_recall: 0.10
    sop_recall: 0.05
    abo_recall: 0.05
    voc_miou: 0.10
  minimum_ratio:
    voc_miou: 0.80

# `python prepare.py aicity` reads the local benchmark manifest and raw videos.
# It writes only crop images and CSV manifests under data/aicity.
aicity:
  benchmark_manifest: /home/megrad/Documents/GitHub/seg_tracking/aicity_handoff_benchmark/outputs/manifest.jsonl
  output_dir: data/aicity
  max_per_camera: 24

# `python demo.py crossdrone` compares mask-guided and global pooling on paired-drone
# observations, then writes one selected-object MP4. `python prepare.py bucktales prepare`
# extracts a small crop set from the downloaded BuckTales videos and annotations.
crossdrone:
  archive: data/bucktales
  manifest: data/crossdrone/observations.csv
  checkpoint: auto
  output: data/crossdrone_reid.mp4
  pair: null                 # prepare/evaluate all pairs; video shows the first pair
  source_camera: null
  target_id: null
  max_gallery_per_identity: 4
  samples_per_identity: 4
  video_frames: 40
  video_stride: 1
  fps: 5
  batch_size: 32
  workers: 0

# `python benchmark.py` compares saved models on identical held-out ReID data
# and writes one HTML report with CMC, retrieval, segmentation, and speed plots.
benchmark:
  output: data/benchmark.html
  images_dir: data/benchmark_figures
  checkpoints:
    Joint aerial expanded: checkpoints/joint_aerial_expanded.pt
    Joint balanced: checkpoints/joint_balanced.pt
    Joint multiview: checkpoints/joint_multiview.pt
    Joint previous: checkpoints/joint_all_current.pt
  compare_global_pool: true
  global_pool_ablation:
    - Joint aerial expanded
    - Joint balanced
    - Joint multiview
  matched_checkpoints:
    ReID only matched: checkpoints/controlled/reid_only.pt
    Joint matched: checkpoints/controlled/joint.pt
  compare_resnet18_imagenet: true
  compare_mobilenetv3_small_imagenet: true
  compare_efficientnet_b0_imagenet: true
  # TorchVision official pretrained classification weights, evaluated as frozen features.
  # The first run downloads missing weights; later runs reuse the local cache.
  extra_imagenet_models:
    - shufflenet_v2_x1_0
    - shufflenet_v2_x1_5
    - mobilenet_v2
    - mobilenet_v3_large
    - efficientnet_b2
    - regnet_y_400mf
    - convnext_tiny
    - swin_t
  aicity_query: data/aicity/query.csv
  aicity_gallery: data/aicity/gallery.csv
  aicity_train: data/aicity/train.csv
  bucktales_manifest: data/crossdrone/observations.csv
  bucktales_pair: null       # evaluate every prepared pair
  max_gallery_per_identity: 4
  voc_root: data/voc
  batch_size: 32
  workers: 0

# Ground-truth object masks for held-out aerial crops. Each mask PNG has the
# same size as its crop: white object, black background. No data is invented.
aerial_mask_eval:
  checkpoints:
    Joint aerial expanded: checkpoints/joint_aerial_expanded.pt
    Joint balanced: checkpoints/joint_balanced.pt
    Joint multiview: checkpoints/joint_multiview.pt
  manifest: data/aerial/masks/eval.csv
  threshold: 0.5

# VRAI's extracted training images and official annotation are stored together.
# `python prepare.py vrai` rebuilds the training and identity-disjoint evaluation CSVs.
vrai:
  root: data/aerial/vrai
  train_manifest: data/aerial/vrai/train.csv
  split_seed: 42

vru:
  root: data/aerial/vru/source
  train_manifest: data/aerial/vru/train.csv

# Both arms start with identical weights and see the same identity data, seed,
# ReID batch size, learning rate, augmentations, and number of ReID updates.
# The joint arm additionally receives VOC mask supervision at mask_every.
# Final-epoch checkpoints are compared; BuckTales is never used for selection.
comparison:
  start_checkpoint: checkpoints/joint_all_current.pt
  output_dir: checkpoints/controlled
  epochs: 12
  steps_per_epoch: 1000

# `python prepare.py visdrone` downloads missing official archives, extracts, then evaluates.
# `python train.py visdrone` is the older crop-only ReID experiment.
visdrone:
  train_root: data/aerial/VisDrone2019-MOT-train
  val_root: data/aerial/VisDrone2019-MOT-val
  train_url: https://drive.google.com/file/d/1-qX2d-P1Xr64ke6nTdlm33om1VxCUTSh/view?usp=sharing
  val_url: https://drive.google.com/file/d/1rqnKe9IgU_crMaxRoel9_nuUsMEBBVQu/view?usp=sharing
  train_mirror_url: https://huggingface.co/datasets/myn0908/visdrone-dataset/resolve/main/VisDrone2019-MOT-train.zip
  val_mirror_url: https://huggingface.co/datasets/myn0908/visdrone-dataset/resolve/main/VisDrone2019-MOT-val.zip
  allow_third_party_mirror: true
  download_if_missing: true
  manifest_dir: data/aerial/visdrone
  frame_step: 10
  min_box: 16
  max_train_per_track: 12
  min_eval_gap: 10
  baseline_checkpoint: checkpoints/joint_all_current.pt
  output_checkpoint: checkpoints/joint_visdrone.pt
  epochs: 1
  batch_size: 32
  learning_rate: 0.00005
  workers: 0
  seed: 42
  augmentation: moderate_occlusion

# `python demo.py` renders a labeled VisDrone sequence as one MP4.
# The boxes and identity labels come from VisDrone; masks and similarities come
# from the trained ShuffleNetV2 crop model.
video:
  checkpoint: auto       # balanced checkpoint when available
  source: null            # null selects the first validation sequence
  output: data/reid_video.mp4
  frames: 45
  stride: 3
  fps: 6
  max_objects: 8
  min_box: 16

# `python demo.py select`: track one VisDrone object through the same sequence.
# Set target_id to null to choose by clicking when a desktop display is available.
select:
  checkpoint: auto
  source: uav0000086_00000_v
  output: data/selected_reid.mp4
  frames: 60
  stride: 3
  fps: 6
  min_box: 16
  target_id: 14
